  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 16% 0%, #22313a 0, #12171c 34%, #0d1115 72%); color: #e8edf0; }
    body > header { padding: 42px max(40px, calc((100vw - 1120px) / 2)) 26px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(9,12,15,.76); }
    .p-title-value { margin: 0 0 20px; font-size: clamp(26px, 4vw, 42px); line-height: 1.12; letter-spacing: -.035em; }
    .label { display: inline-flex; margin-right: 8px; padding: 5px 9px; border-radius: 999px; background: rgba(61,183,199,.16); color: #58d0df; font-size: 12px; letter-spacing: .02em; vertical-align: middle; }
    .buttonGroup { display: flex; flex-wrap: wrap; gap: 9px; }
    .buttonGroup > a { padding: 9px 13px !important; border: 1px solid rgba(61,183,199,.3) !important; border-radius: 999px !important; background: rgba(61,183,199,.08) !important; color: #65d4e2 !important; font-size: 12px; font-weight: 750; text-decoration: none; }
    article.message { max-width: 1040px; margin: 26px auto; overflow: hidden; border: 1px solid rgba(255,255,255,.09); border-radius: 16px; background: rgba(25,31,37,.92); box-shadow: 0 20px 60px rgba(0,0,0,.18); }
    #promoted-message { display: none; }
    .message-attribution { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.07); color: #a9b4bb; font-size: 12px; }
    .message-attribution ul { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .message-attribution a { color: #7ad3df; text-decoration: none; }
    .message-content { padding: 22px; }
    .message-body { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .message-body > a { padding: 30px 18px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: linear-gradient(145deg, rgba(61,183,199,.13), rgba(255,255,255,.025)); color: #dce8ec; text-align: center; text-decoration: none; }
    footer { padding: 0 22px 18px; color: #748089; font-size: 11px; }
  </style>
  <script>
    window.GM_xmlhttpRequest = options => {
      const request = { abort() {} };
      const fixtureDelay = new URLSearchParams(location.search).has('slow') ? 1200 : 0;
      setTimeout(() => {
        if (!/\/(?:attachments|data\/video)\//.test(String(options.url))) {
          options.onerror?.(new Error('fixture blocks external network'));
          return;
        }

        const isVideo = /\.mp4(?:$|[?#])/i.test(String(options.url));
        const headers = `content-type: ${isVideo ? 'video/mp4' : 'image/jpeg'}\r\n`;
        options.onreadystatechange?.({
          readyState: 2,
          status: 200,
          responseHeaders: headers,
          finalUrl: options.url,
        });
        options.onprogress?.({ loaded: 4, total: 4 });
        options.onload?.({
          readyState: 4,
          status: 200,
          response: new Blob(['test'], { type: isVideo ? 'video/mp4' : 'image/jpeg' }),
          responseText: '',
          responseHeaders: headers,
          finalUrl: options.url,
        });
      }, fixtureDelay);
      return request;
    };
    window.__savedSettings = [];
    window.GM_setValue = (key, value) => window.__savedSettings.push({ key, value });
    window.GM_getValue = (key, fallback) => key === 'xfpd_post_settings_v4'
      ? { zipped: true, createPerformerFolder: true }
      : fallback;
    window.__downloads = [];
    window.GM_download = options => {
      window.__downloads.push(options.name);
      setTimeout(() => options.onload?.(), 0);
    };
    window.GM_openInTab = () => ({ close() {} });
    window.__nativeWrites = [];
    window.__pickerCalls = 0;
    window.__pickerOptions = [];
    window.__pickerFailuresRemaining = new URLSearchParams(location.search).has('picker-error') ? 1 : 0;
    class FixtureFileHandle {
      constructor(path) { this.path = path; }
      async createWritable() {
        const path = this.path;
        return {
          async write(blob) { window.__nativeWrites.push({ path, size: blob.size }); },
          async close() {},
        };
      }
    }
    class FixtureDirectoryHandle {
      constructor(path = '', name = '') {
        this.path = path;
        this.name = name || path.split('/').filter(Boolean).pop() || 'Downloads';
        this.directories = new Map();
        this.files = new Map();
      }
      async getDirectoryHandle(name, options = {}) {
        if (this.directories.has(name)) return this.directories.get(name);
        if (!options.create) throw new DOMException('Missing', 'NotFoundError');
        const handle = new FixtureDirectoryHandle([this.path, name].filter(Boolean).join('/'), name);
        this.directories.set(name, handle);
        return handle;
      }
      async getFileHandle(name, options = {}) {
        if (this.files.has(name)) return this.files.get(name);
        if (!options.create) throw new DOMException('Missing', 'NotFoundError');
        const handle = new FixtureFileHandle([this.path, name].filter(Boolean).join('/'));
        this.files.set(name, handle);
        return handle;
      }
    }
    window.__fixtureDownloadRoot = new FixtureDirectoryHandle('', 'Downloads');
    window.__fixturePerformerRoot = new FixtureDirectoryHandle('Fixture Performer', 'Fixture Performer');
    if (!new URLSearchParams(location.search).has('portable')) {
      window.showDirectoryPicker = async options => {
        window.__pickerCalls += 1;
        window.__pickerOptions.push(options);
        if (options?.id && (options.id.length > 32 || !/^[A-Za-z0-9_-]+$/.test(options.id))) {
          throw new TypeError('Invalid picker id');
        }
        if (window.__pickerFailuresRemaining > 0) {
          window.__pickerFailuresRemaining -= 1;
          throw new DOMException('Fixture picker failure', 'SecurityError');
        }
        return new URLSearchParams(location.search).has('select-performer')
          ? window.__fixturePerformerRoot
          : window.__fixtureDownloadRoot;
      };
    }
    window.__zipEntries = [];
    window.JSZip = class JSZip {
      file(path) {
        window.__zipEntries.push(path);
        return this;
      }
      generateAsync() {
        return Promise.resolve(new Blob(['zip'], { type: 'application/zip' }));
      }
    };
    window.tippy = (_target, options) => {
      const instance = { hide() {} };
      if (typeof _target !== 'string' && typeof options.content === 'string') {
        const holder = document.createElement('div');
        holder.innerHTML = options.content;
        const content = holder.firstElementChild;
        if (content) document.body.appendChild(content);
      }
      setTimeout(() => options.onShown?.(instance), 0);
      return [instance];
    };
    window.__savedBlobs = [];
    window.saveAs = (_blob, name) => window.__savedBlobs.push(name);
  </script>
</head>
